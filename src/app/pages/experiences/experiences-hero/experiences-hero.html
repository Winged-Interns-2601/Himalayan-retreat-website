<section
  #heroSection
  class="experience-hero"
  [class.is-visible]="isVisible"
>

  <!-- ========================================================
       BACKGROUND
       ======================================================== -->

  <div class="experience-hero__media">

    <img
      src="./images/experiences-hero.png"
      alt="Himalayan mountain landscape at sunset"
    />

  </div>


  <!-- ========================================================
       DARK CINEMATIC VEIL
       ======================================================== -->

  <div class="experience-hero__veil"></div>


  <!-- ========================================================
       LEFT PAGE NAVIGATION
       ======================================================== -->

  <aside class="experience-hero__navigation">

    <div class="experience-hero__numbers">

      <span class="active">01</span>
      <span>02</span>
      <span>03</span>
      <span>04</span>
      <span>05</span>
      <span>06</span>
      <span>07</span>

    </div>

    <div class="experience-hero__nav-line"></div>

    <span class="experience-hero__scroll-label">
      SCROLL
    </span>

  </aside>


  <!-- ========================================================
       RIGHT COORDINATES
       ======================================================== -->

  <div class="experience-hero__coordinates">

    <span>32° N</span>
    <span>77° E</span>

  </div>


  <!-- ========================================================
       MAIN CONTENT
       ======================================================== -->

  <div class="experience-hero__content">

    <div class="experience-hero__eyebrow">

      <span>01</span>

      <i></i>

      <span>THE EXPERIENCE</span>

    </div>


    <h1>
      Moments<br />
      beyond the<br />
      ordinary.
    </h1>


    <p>
      From quiet mornings in nature to cultural encounters
      and curated adventures — every experience at LUNÉ
      is designed to inspire, restore and connect.
    </p>


    <a
      href="#curated-experiences"
      class="experience-hero__cta"
    >

      <span>EXPLORE EXPERIENCES</span>

      <span class="experience-hero__arrow">
        →
      </span>

    </a>

  </div>


  <!-- ========================================================
       BOTTOM LOCATION
       ======================================================== -->

  <div class="experience-hero__location">

    <span>THE HIMALAYAS</span>

    <i></i>

    <span>HIMACHAL PRADESH · INDIA</span>

  </div>

</section>
