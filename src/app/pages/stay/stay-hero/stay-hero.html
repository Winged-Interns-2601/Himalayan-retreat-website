<section class="stay-hero">
  <div class="stay-hero__media">
    <img
      src="./images/stay-hero-mountain-lodge.png"
      alt="Luxury mountain retreat surrounded by the Himalayas"
    />
  </div>

  <div class="stay-hero__veil"></div>

  <div class="stay-hero__content">
    <div class="stay-hero__eyebrow">
      <span>01</span>
      <i></i>
      <span>THE STAY</span>
    </div>

    <h1>
      A Place<br />
      To Slow Down.
    </h1>

    <p>
      A private mountain retreat shaped by silence,
      light and the landscape.
    </p>

    <div class="stay-hero__location">
      <span>HIMACHAL PRADESH</span>
      <span>·</span>
      <span>INDIA</span>
    </div>

    <button
      type="button"
      class="stay-hero__cta"
      (click)="scrollToResidence()"
    >
      <span>Explore The Residence</span>
      <span class="stay-hero__arrow">↓</span>
    </button>
  </div>

  <div class="stay-hero__side-note">
    <span>THE LUNÉ RESIDENCE</span>
    <span>32° N · 77° E</span>
  </div>

  <div class="stay-hero__scroll">
    <span>SCROLL</span>
    <span class="stay-hero__scroll-line"></span>
  </div>
</section>
